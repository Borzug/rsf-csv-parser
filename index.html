<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally Race Chart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="app">

    <header class="app-header">
        <span class="header-logo">🏁</span>
        <h1 id="header-event-name">Rally Race Chart</h1>
        <a id="header-rally-link" class="header-rally-link" target="_blank" rel="noopener" style="display:none">rallysimfans ↗</a>
        <span id="header-stats" class="header-stats"></span>
        <div class="lang-switcher" id="lang-switcher">
            <button class="lang-btn active" data-lang="ru" lang="ru" aria-label="Русский">RU</button>
            <button class="lang-btn" data-lang="en" lang="en" aria-label="English">EN</button>
            <button class="lang-btn" data-lang="hu" lang="hu" aria-label="Magyar">HU</button>
        </div>
    </header>

    <!-- ═══ WELCOME ═══ -->
    <section id="screen-welcome">
        <div class="welcome-card">
            <div class="welcome-icon">📊</div>
            <h2 id="welcome-title">Загрузка данных ралли</h2>
            <p class="welcome-desc" id="welcome-desc">Выберите CSV-файл с результатами гонки.</p>
            <div class="form-group">
                <label for="inp-event-name" id="label-event-name">Название события <span class="optional">(необязательно)</span></label>
                <input type="text" id="inp-event-name" placeholder="Rally Championship 2024" autocomplete="off">
            </div>
            <input type="file" id="file-input" accept=".csv,.txt" style="display:none">
            <button class="btn btn-primary" id="btn-choose-file">📂 Выбрать CSV-файл</button>
            <p class="drop-hint" id="drop-hint">или перетащите файл сюда</p>
            <div id="file-info" class="file-info"></div>
            <button class="btn btn-ghost btn-resume" id="btn-resume" style="display:none"></button>
            <p class="welcome-help" id="welcome-help"></p>
        </div>
    </section>

    <div id="drop-overlay" class="drop-overlay"><span id="drop-overlay-text">Отпустите CSV-файл</span></div>

    <!-- ═══ ANALYSIS ═══ -->
    <section id="screen-chart" style="display:none">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span id="sidebar-filters-label">Фильтры</span>
                <button class="btn btn-ghost btn-sm" id="btn-back">← Назад</button>
                <button class="sidebar-close" id="btn-sidebar-close" type="button" aria-label="Закрыть">×</button>
            </div>
            <div class="sidebar-body">
                <div id="sidebar-chart-filters">
                    <div id="filter-stages"></div>
                    <div id="filter-drivers-wrap"></div>
                    <div id="filter-groups"></div>
                    <div id="filter-cars"></div>
                </div>
                <div id="sidebar-results-filters" style="display:none">
                    <div id="filter-results-groups"></div>
                </div>
                <div id="sidebar-comments-filters" style="display:none">
                    <div id="filter-comments-search"></div>
                </div>
            </div>
        </aside>

        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <!-- Main content -->
        <main class="chart-main">

            <!-- Tab bar -->
            <div class="main-toolbar">
                <button class="btn-filters" id="btn-filters" type="button" aria-controls="sidebar" aria-expanded="false">☰ <span id="btn-filters-label">Фильтры</span></button>
                <div class="tab-switcher">
                    <button class="tab-btn active" id="tab-chart">📈 График</button>
                    <button class="tab-btn" id="tab-results">🏆 Результаты</button>
                    <button class="tab-btn" id="tab-comments">💬 Комментарии</button>
                </div>
                <div class="chart-toolbar" id="chart-toolbar">
                    <div class="chart-type-legend">
                        <span class="ctl-item"><span class="ctl-line ctl-solid"></span><span id="chart-legend-success">Успешный проезд</span></span>
                        <span class="ctl-item"><span class="ctl-line ctl-dashed"></span><span id="chart-legend-sr">Super Rally</span></span>
                        <span class="ctl-item"><span class="ctl-diamond">◆</span><span id="chart-legend-comment">Комментарий</span></span>
                    </div>
                    <div class="seg-switch" id="ymode-switch" role="group">
                        <button class="seg-btn active" data-ymode="leader" id="ymode-leader">От лидера</button>
                        <button class="seg-btn" data-ymode="abs" id="ymode-abs">Время</button>
                        <button class="seg-btn" data-ymode="pinned" id="ymode-pinned">От выбранного</button>
                    </div>
                </div>
            </div>

            <!-- Content row (chart + legend, or results) -->
            <div class="content-row">

                <!-- ── CHART VIEW ── -->
                <div id="view-chart" class="view">
                    <div id="pinned-bar" class="pinned-bar" style="display:none">
                        <div class="pinned-chips" id="pinned-chips"></div>
                        <span class="pinned-hint" id="pinned-hint"></span>
                        <button class="pinned-close" id="pinned-close" title="Снять выделение (Esc)">×</button>
                    </div>
                    <div id="chart-area" class="chart-area">
                        <canvas id="race-chart" role="img" aria-label="График хода гонки"></canvas>
                    </div>
                </div>

                <!-- ── LEGEND PANEL ── -->
                <div id="legend-panel" class="legend-panel" style="display:none">
                    <button id="legend-expand-btn" class="legend-expand-btn" style="display:none" title="Развернуть">‹</button>
                    <!-- Быстрый переход к участнику; список не фильтруется (см. legendSearch.ts) -->
                    <div class="legend-search">
                        <input id="legend-search" class="legend-search-input" type="text" autocomplete="off" spellcheck="false" placeholder="Найти участника">
                        <span id="legend-search-count" class="legend-search-count" aria-live="polite"></span>
                    </div>
                    <div class="legend-inner" id="legend-inner">
                        <div class="legend-items" id="legend-items"></div>
                    </div>
                </div>

                <!-- ── RESULTS VIEW ── -->
                <div id="view-results" class="view" style="display:none">
                    <div class="results-wrap">
                        <table class="results-table" id="results-table">
                            <thead id="results-thead"></thead>
                            <tbody id="results-tbody"></tbody>
                        </table>
                    </div>
                    <div id="apply-filter-bar" class="apply-filter-bar">
                        <span id="apply-filter-count"></span>
                        <button id="btn-apply-filter">Применить фильтр по участникам</button>
                    </div>
                </div>

                <div id="view-comments" class="view" style="display:none"></div>
            </div>
        </main>
    </section>

    <div id="chart-tooltip"  class="chart-tooltip"></div>
    <div id="cell-tooltip"   class="cell-tooltip"></div>

</div>
<script type="module" src="dist/renderer/index.js"></script>
</body>
</html>
